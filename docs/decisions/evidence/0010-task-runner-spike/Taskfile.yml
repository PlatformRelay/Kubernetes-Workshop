version: '3.52.0'

tasks:
  default:
    cmds:
      - task: help
    silent: true

  help:
    desc: List the fixture tasks
    cmd: >-
      printf '%s\n'
      'commands: help up down doctor profile-observability args tool-version'
    silent: true

  preflight:
    internal: true
    preconditions:
      - sh: test -f .ready
        msg: missing .ready

  up:
    desc: Simulate workshop up
    deps: [preflight]
    cmd: ./runner.sh up

  down:
    desc: Simulate workshop down
    cmd: ./runner.sh down

  doctor:
    desc: Simulate workshop doctor
    cmd: ./runner.sh doctor

  addon-gateway-api:
    internal: true
    cmd: ./runner.sh addon-gateway-api

  addon-metrics-server:
    internal: true
    cmd: ./runner.sh addon-metrics-server

  profile-observability:
    desc: Compose a cluster and its observability prerequisites
    cmds:
      - task: up
      - task: addon-gateway-api
      - task: addon-metrics-server
      - task: doctor

  args:
    desc: Preserve arguments after --
    cmd: ./runner.sh args {{.CLI_ARGS}}

  tool-version:
    desc: Resolve a locked tool absent from the host PATH
    cmd: ./tool-version.sh
