site_name: Kubernetes Practitioner Workshop
site_description: Workshop de Kubernetes gratuito e open source — decks Slidev, labs, quizzes e PDFs.
site_url: https://platformrelay.github.io/Kubernetes-Workshop/
repo_url: https://github.com/PlatformRelay/Kubernetes-Workshop
repo_name: PlatformRelay/Kubernetes-Workshop
copyright: Copyright &copy; 2026 Platform Relay — 0BSD License

docs_dir: docs
site_dir: site
strict: true

validation:
  # Labs / infra live outside docs_dir; repo-relative ../labs links are intentional.
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore

# Keep agent/coordination and pin files out of the published site.
exclude_docs: |
  decisions/**
  validation-evidence/**
  requirements-docs.in
  requirements-docs.txt
  security/**
  timing-results-template.md

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Mudar para o modo claro
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Mudar para o modo escuro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PlatformRelay/Kubernetes-Workshop

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Comece por aqui:
      - Rodar os slides localmente: run-slides.md
      - Cluster kind local: setup.md
      - Windows / WSL2: windows-wsl2.md
  - Currículo:
      - Syllabus: syllabus.md
      - Guia do facilitador: facilitator-guide.md
      - Limitações conhecidas: beta-limitations.md
  - Downloads e prévias:
      - Decks ao vivo e PDFs: downloads.md
  - Projeto:
      - Roadmap: roadmap.md
      - Processo de release: release.md
      - Matriz de validação: validation-matrix.md
      - Checklist de ensaio: rehearsal-checklist.md
