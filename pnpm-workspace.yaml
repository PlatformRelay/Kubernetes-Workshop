shamefullyHoist: true

# pnpm v11 errors on unapproved dependency build scripts, so allowlist the
# ones we rely on: `playwright-chromium` (downloads the browser that
# `slidev export` needs for PDF/PNG/PPTX output) and `sharp` (its install
# script just verifies/falls back from the prebuilt libvips binaries that the
# showcase-GIF assembly uses — scripts/make-showcase-gif.mjs).
allowBuilds:
  playwright-chromium: true
  sharp: true

overrides:
  # GHSA-r28c-9q8g-f849 is fixed in 8.5.18. Keep every transitive Vue/Vite
  # consumer on the current patched PostCSS line until upstream ranges converge.
  postcss: 8.5.25
  # GHSA-pm4m-ph32-ghv5 affects only js-yaml 5.0.0 through 5.2.1. Keep the
  # markdownlint 5.x line patched without forcing its unrelated 3.x/4.x users
  # across a major-version boundary.
  "js-yaml@>=5.0.0 <6.0.0": 5.2.3
  # GHSA-5p4m-2wfm-xmqj (CVE-2026-59870) hits both the 3.x and 4.x js-yaml
  # lines that @slidev/cli pulls in transitively. The fix was released on each
  # line separately, so pin each range to its own first patched version rather
  # than dragging Slidev's YAML parser across a major-version boundary.
  "js-yaml@>=4.0.0 <5.0.0": 4.3.1
  "js-yaml@>=3.0.0 <4.0.0": 3.15.1
  # GHSA-2v37-7h3g-55p8: nanoid custom generators can loop indefinitely when
  # size is zero. Patched separately per line (3.x at 3.3.17, 5.x at 5.1.6);
  # postcss pulls the 3.x line transitively, so pin that range to its first
  # patched version without dragging any consumer across a major boundary.
  "nanoid@>=3.0.0 <4.0.0": 3.3.17
  # monaco-editor / mermaid pull older DOMPurify; pin the patched line.
  dompurify: 3.4.13
  # Dependabot/GHSA collapses @hono/node-server to "<2.0.5" even though
  # 1.19.15+ is patched on the 1.x line; pin 2.1.0 so the alert clears.
  # MCP only needs getRequestListener from this package.
  "@hono/node-server": 2.1.0
  # Five advisories against the mermaid @slidev/client pulls in, all first
  # patched in 11.16.1: prototype pollution in the architecture renderer
  # (GHSA-2v8p-3f2j-5mp7) and the config APIs (GHSA-c4c3-pg64-4m4v), DoS in the
  # radar (GHSA-rhh3-jpg6-66xh) and XY-chart (GHSA-6x64-9x62-f2gx) renderers,
  # and sibling-element CSS injection (GHSA-3rrr-jr9j-h3q3). The deck only uses
  # flowchart and stateDiagram-v2, so this is a patch bump on the same line.
  mermaid: 11.16.1

# pnpm 11 minimumReleaseAge gate: allow this override pin through when fresh on the registry.
minimumReleaseAgeExclude:
  - '@hono/node-server@2.1.0'
  - 'nanoid@3.3.17'

