name: CI

# Fast gate on every PR and every push to main: lint the labs, verify the deck manifest,
# and build the live + compatibility entries so broken content fails review. A separate
# job re-renders the README's animated showcase GIF from the deck sources
# (US-OSS-2: the committed GIF must stay reproducible from a clean checkout).
# Full PDF export (slow) is intentionally left to the release job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Slidev + pnpm must run non-interactively; pnpm 11 otherwise prompts on its
  # dependency-build allowlist. (GitHub Actions also sets CI=true itself.)
  CI: "true"

permissions:
  contents: read

jobs:
  supply-chain:
    name: Supply-chain policy and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test and enforce repository supply-chain policy
        run: |
          node --test scripts/supply-chain-policy.test.mjs scripts/dependency-audit.test.mjs
          node scripts/supply-chain-policy.mjs
      - name: Audit the locked dependency graph
        run: node scripts/dependency-audit.mjs

  lint:
    name: Lint labs (markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:labs
      - run: pnpm lint

  link-check:
    name: Link-check front-door docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Zero-dependency Node script — no pnpm install needed. Fails on a missing
      # internal target, a broken relative anchor, or an unresolved <pages-url>.
      - run: node scripts/link-check.mjs
      - run: node --test scripts/pages-site.test.mjs

  infra:
    name: Infra scripts (shellcheck + bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Shellcheck infra scripts and test stubs
        run: |
          find infra -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 shellcheck
          shellcheck infra/tests/stubs/*
          # The top-level ./workshop wrapper is outside the infra glob above, so
          # lint it explicitly (US-ENV-2).
          shellcheck ./workshop
          # Release helpers used by release.yml (US-BETA-7 / US-RELEASE-1).
          shellcheck ./scripts/release-notes-flags.sh
          shellcheck ./scripts/release-tag-guard.sh
      - name: Run bats tests (mocked binaries — no cluster needed)
        run: bats infra/tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check lab inventory drift (US-ENV-4A)
        run: node --test scripts/lab-inventory.test.mjs && node scripts/lab-inventory.mjs --check

  build:
    name: Build root decks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test manifest and build live, compatibility, and template decks
        run: |
          pnpm run test:deck
          pnpm run test:quiz
          pnpm run quiz:validate
          pnpm run quiz:license-gate
          pnpm run decks:check
          pnpm run build:day1
          pnpm run build:day2
          pnpm run build:day3
          pnpm run build:optional
          pnpm run build:superset
          pnpm run build:3day
          pnpm run build:templates

  showcase-gif:
    # US-OSS-2: the README's animated deck tour must be reproducible from a
    # clean checkout with zero manual steps. This regenerates it end-to-end
    # (slidev export → per-click PNG frames → sharp GIF assembly) and uploads
    # the result, so a drifted showcase page range or a broken pipeline fails
    # the PR instead of rotting silently. The committed GIF is refreshed by
    # running `pnpm showcase:gif` locally and committing the result.
    name: Render README showcase GIF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium system dependencies
        # The browser binary itself is fetched by playwright-chromium's
        # postinstall; this adds the OS libraries slidev export needs headless.
        run: pnpm exec playwright install-deps chromium
      - name: Render the showcase GIF from the deck sources
        run: pnpm showcase:gif
      - name: Upload the rendered GIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deck-showcase-gif
          path: docs/images/deck-showcase.gif
          if-no-files-found: error
