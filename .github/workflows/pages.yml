name: Deploy to GitHub Pages

# Publishes documentation + interactive decks on every push to main:
#   <pages-url>/                 → MkDocs landing (Material)
#   <pages-url>/deck/            → full Slidev superset (hash router)
#   <pages-url>/deck/3day/       → canonical 3-day cut
#   <pages-url>/deck/day-{1,2,3}/→ live day entries
#   <pages-url>/deck/templates/  → design-system gallery
# Legacy /3day/ and /templates/ URLs redirect into /deck/…
#
# One-time manual prerequisite: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  build:
    name: Build docs + decks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements-docs.txt

      - name: Install MkDocs
        run: python3 -m pip install -r docs/requirements-docs.txt

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build MkDocs + Slidev Pages tree
        # Base path MUST use the exact repo-name case (Kubernetes-Workshop).
        # Hash router is required so slide deep links / refreshes work on
        # project Pages (history mode 404s under the subpath).
        env:
          PAGES_BASE: /${{ github.event.repository.name }}
        run: |
          chmod +x scripts/pages-build.sh
          PAGES_BASE="${PAGES_BASE}" ./scripts/pages-build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          # Pages backend intermittently reports deployment_in_progress well
          # past the 10-min default (2026-08-06 outage-like stall).
          timeout: 900000
